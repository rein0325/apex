[project]
name = "apex"
version = "0.1.0"
description = "台股智慧量化投資決策系統"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=50.0.2",
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/apex/site.py" = ["E501"]  # HTML／CSS 樣板
"src/apex/candidates.py" = ["E501"]  # 白話說明對照表
