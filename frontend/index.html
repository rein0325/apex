  <p class="meta" id="meta">讀取中…</p>

  <section class="card">
    <div class="hero">
      <div id="light"></div>

    <p class="subtle" id="otc" hidden></p>
    <div id="regime-help"></div>
  </section>

  <section class="card">
    <h2>近一年走勢</h2>
    <div class="legend">
      <span><i class="s1"></i>大盤（含股利）</span><span><i class="s2"></i>0050</span>

  </section>

    <div id="industries"></div>
    <div id="ind-help"></div>
  </section>

  <section class="card">
    <div class="statusline" id="status-line"></div>
    <details class="help"><summary>看每一項資料</summary><div id="status-list"></div></details>
  </section>

  <details class="card">
    <summary><b>研究策略的模擬追蹤</b> <span class="note" id="paper-since"></span></summary>
    <p class="note">這些策略在歷史驗證中都沒有通過，只用真實行情追蹤後續表現（紙上交易，扣除約略成本）。不公開個股，也不是買賣建議。</p>
    <div class="row-list" id="paper"></div>
  </details>

  <p class="note">個人研究用途的市場資訊整理，不構成投資建議；過去表現不代表未來。資料來源：臺灣證券交易所、證券櫃檯買賣中心。</p>
