<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>我的持股</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台股">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav class="nav"><a href="index.html">市場狀態</a><a href="picks.html">候選股票</a><a href="holdings.html" class="active">我的持股</a></nav>
  <p class="meta" id="price-date">讀取行情中…</p>
  <p class="subtle">資料只存在這個瀏覽器，不會上傳。換手機或清除瀏覽器資料就會不見，記得到最下面「交易紀錄與備份」匯出 CSV。</p>

  <section class="card">
    <p class="subtle" style="margin:0">總資產（元）</p>
    <div class="big-num" id="k-total">—</div>
    <div class="facts">
      <span>未實現 <b id="k-unreal">—</b></span>
      <span>已實現 <b id="k-real">—</b></span>
      <span>股票市值 <b id="k-value">—</b></span>
    </div>
    <div class="bar-labels" style="margin-top:14px"><span>從最高點回落（回撤）</span><b id="k-dd">—</b></div>
    <div id="dd-bar"></div>
    <div class="bar-labels"><span>0%</span><span id="dd-note">目標 −25%｜上限 −30%</span></div>
    <div class="bar-labels" style="margin-top:12px"><span>股票占總資產</span><b id="k-ratio">—</b></div>
    <div id="ratio-bar"></div>
    <div class="bar-labels"><span id="ratio-note"></span></div>
    <div id="warnings"></div>
    <label class="row">帳戶現金（元）
      <input type="number" id="cash" min="0" step="1" inputmode="numeric" placeholder="0">
    </label>
  </section>

  <h2 class="section-title">我的股票</h2>
  <p class="subtle" id="view-note"></p>
  <div id="cards"></div>
  <div class="card" id="cards-help"></div>

  <section class="card">
    <h2>新增交易</h2>
    <form id="trade-form" class="form">
      <label>日期<input type="date" id="f-date" required></label>
      <label>代號或名稱<input id="f-code" list="codes" required autocomplete="off" placeholder="例如 0050"></label>
      <datalist id="codes"></datalist>
      <label>買／賣<select id="f-side"><option value="buy">買進</option><option value="sell">賣出</option></select></label>
      <label>股數<input type="number" id="f-shares" min="1" step="1" inputmode="numeric" required></label>
      <label>成交價<input type="number" id="f-price" min="0.01" step="0.01" inputmode="decimal" required></label>
      <label>手續費<input type="number" id="f-fee" min="0" step="1" inputmode="numeric" placeholder="自動"></label>
      <label>證交稅<input type="number" id="f-tax" min="0" step="1" inputmode="numeric" placeholder="自動"></label>
      <label>備註<input id="f-note" placeholder="可留空"></label>
      <p class="note full" id="f-hint"></p>
      <button type="submit" class="full">新增</button>
    </form>
    <details>
      <summary>手續費設定</summary>
      <label class="row">手續費折扣（1 = 無折扣，0.28 = 2.8 折）
        <input type="number" id="discount" min="0.01" max="1" step="0.01" inputmode="decimal">
      </label>
    </details>
  </section>

  <details class="card">
    <summary><b>交易紀錄與備份</b></summary>
    <div class="scroll">
      <table id="trades">
        <thead><tr><th>日期</th><th>股票</th><th>買賣</th><th>股數</th><th>價格</th><th>費用</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="buttons">
      <button type="button" id="export">匯出 CSV</button>
      <label class="button">匯入 CSV<input type="file" id="import" accept=".csv,text/csv" hidden></label>
      <button type="button" id="reset-history" class="secondary">重設回撤紀錄</button>
      <button type="button" id="clear" class="danger">清除全部</button>
    </div>
    <p class="note">CSV 格式和電腦上的 personal/trades.csv 相同，可以互相匯入。回撤是從你開始使用這一頁那天起，每次打開時依收盤價累積計算。</p>
  </details>

  <p class="note">本頁只做記帳與計算，不構成投資建議。</p>
</main>
<script src="ui.js"></script>
<script src="chart.js"></script>
<script src="holdings.js"></script>
</body>
</html>
