name: 測試

# 每次推送、開 PR 或手動觸發時，在雲端跑程式風格檢查與全部測試。
# 本機的 Windows「智慧型應用程式控制」會擋 DuckDB 元件（2026-11-20 起），所以測試以雲端結果為準。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: uv sync --frozen

      - name: 程式風格檢查
        run: uv run python -m ruff check .

      - name: 測試
        run: uv run python -m pytest -q
