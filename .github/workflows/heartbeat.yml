name: 排程心跳

# 診斷用（2026-11-24 加）：「每日更新」的排程從來沒有自動觸發過。
# 這個工作流程什麼都不做，只在每小時 07、37 分記一筆「我有被叫起來」。
# - 心跳有跑、每日更新沒跑 → 問題出在 daily.yml 本身。
# - 心跳也沒跑 → 整個專案的排程都沒作用，要找 GitHub 處理。
# 確認原因後就刪掉這個檔案。
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 記錄觸發時間
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          now=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')
          echo "::notice title=排程心跳::觸發方式 ${EVENT}、排程 ${CRON:-無}、實際開始（台灣時間）${now}"
