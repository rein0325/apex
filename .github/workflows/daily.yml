name: 每日更新

# 台灣時間平日 18:04 到隔天 08:54，每 10 分鐘排一次（約 90 次）。
# GitHub 排程大多會被略過（2026-11-24 實測：心跳約 43 次只觸發 2 次），所以密集排。
# 先由 check 判斷：網站已是最新就跳過，不重跑（.github/daily_check.py）。手動執行一律會跑。
# 過了午夜資料仍不是最新，就標示失敗並寄通知。整晚都沒被觸發時，這裡無法通知。
on:
  schedule:
    - cron: "4-54/10 10-23 * * 1-5"
    - cron: "4-54/10 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write # 推送模擬追蹤的雜湊承諾、更新加密資料庫備份
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Asia/Taipei
  PYTHONIOENCODING: utf-8
  APEX_DB_KEY: ${{ secrets.APEX_DB_KEY }}
  APEX_VIEW_PASSWORD: ${{ secrets.APEX_VIEW_PASSWORD }} # 候選股票頁的密碼
  SNAPSHOT: ${{ github.workspace }}/snapshot/apex-db.tar.enc

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      final: ${{ steps.check.outputs.final }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: python3 .github/daily_check.py https://rein0325.github.io/apex/data.json

  daily:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend # 後端程式；網站畫面在 frontend/
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: uv sync --frozen

      - name: 還原資料庫（Actions 快取，加密）
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SNAPSHOT }}
          key: apex-db-${{ github.run_id }}
          restore-keys: apex-db-

      - name: 沒有快取時，從 Release 下載加密快照
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download db-seed --pattern apex-db.tar.enc --dir "$(dirname "$SNAPSHOT")"

      - name: 解密並還原資料庫
        id: restore
        run: uv run python -m apex snapshot restore "$SNAPSHOT"

      - name: 每日流程（更新資料、月底記錄模擬追蹤、候選股票、產生網站）
        id: daily
        run: |
          extra=""
          if [ "${{ needs.check.outputs.final }}" = "true" ]; then extra="--fail-if-stale"; fi
          uv run python -m apex daily --record-paper --site "$GITHUB_WORKSPACE/site" $extra

      - name: 加密匯出資料庫
        if: always() && steps.restore.outcome == 'success'
        run: uv run python -m apex snapshot export "$SNAPSHOT"

      - name: 保存資料庫到快取
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SNAPSHOT }}
          key: apex-db-${{ github.run_id }}

      - name: 週五、週六更新 Release 備份（快取 7 天沒用會被刪除）
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%u)" = "5" ] || [ "$(date +%u)" = "6" ]; then gh release upload db-seed "$SNAPSHOT" --clobber; fi

      - name: 推送模擬追蹤雜湊承諾
        if: always() && steps.daily.outcome != 'skipped'
        run: |
          if [ -n "$(git status --porcelain paper/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper/
            git commit -m "Record paper-trading commitments"
            git pull --rebase
            git push
          fi

      - name: 上傳網站
        if: always() && hashFiles('site/data.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 過了午夜資料仍不是最新就失敗（GitHub 會寄通知）
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          if [ "$(date +%-H)" -lt 18 ] && [ "$(jq -r .stale site/data.json)" = "true" ]; then
            echo "::error title=資料過舊::應到 $(jq -r .expected_date site/data.json)，只到 $(jq -r .data_date site/data.json)"
            exit 1
          fi

  deploy:
    needs: daily
    if: always() && (needs.daily.result == 'success' || needs.daily.result == 'failure')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
