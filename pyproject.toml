[project]
name = "apex"
version = "0.1.0"
description = "台股智慧量化投資決策系統"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
